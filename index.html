<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browser Strike</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
</head>

<body>

<div id="menu">
    <div class="menu-box">
        <h1>BROWSER STRIKE</h1>

        <input
            id="nameInput"
            type="text"
            maxlength="16"
            placeholder="Twój nick"
        >

        <button id="playButton">
            GRAJ
        </button>

        <p id="serverStatus">Łączenie z serwerem...</p>

        <small>
            WASD — ruch<br>
            Mysz — celowanie<br>
            LPM — strzał<br>
            R — przeładowanie<br>
            ESC — uwolnij mysz
        </small>
    </div>
</div>

<div id="hud">

    <div id="crosshair">
        +
    </div>

    <div id="health">
        <span>HP</span>
        <strong id="healthValue">100</strong>
    </div>

    <div id="ammo">
        <strong id="ammoValue">30</strong>
        <span>/ 90</span>
    </div>

    <div id="players">
        Gracze: <span id="playerCount">1</span>
    </div>

    <div id="message"></div>

</div>

<script src="game.js"></script>

</body>
</html>
